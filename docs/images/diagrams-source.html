const TONES = {
  gray: { accent: "#64748b", tint: "#f8fafc", stroke: "#cbd5e1" },
  blue: { accent: "#2563eb", tint: "#eff6ff", stroke: "#bfdbfe" },
  green: { accent: "#059669", tint: "#ecfdf5", stroke: "#a7f3d0" },
  red: { accent: "#dc2626", tint: "#fef2f2", stroke: "#fecaca" },
  amber: { accent: "#d97706", tint: "#fffbeb", stroke: "#fcd34d" },
  violet: { accent: "#7c3aed", tint: "#f5f3ff", stroke: "#c4b5fd" },
  teal: { accent: "#0d9488", tint: "#f0fdfa", stroke: "#99f6e4" },
  navy: { accent: "#0f172a", tint: "#0f172a", stroke: "#0f172a" },
};
const measure = document.createElement("canvas").getContext("2d");
function width(text, size, weight = 400, mono = false) {
  measure.font = `${weight} ${size}px ${mono ? "Consolas, monospace" : '"Segoe UI", system-ui, sans-serif'}`;
  return measure.measureText(text).width;
}
const esc = (value) => String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function text(content, x, y, { size = 14, weight = 400, color = "#0f172a", anchor = "start", mono = false, spacing = 0, lh = 18 } = {}) {
  return String(content).split("\n").map((line, index) =>
    `<text x="${x}" y="${y + index * lh}" font-size="${size}" font-weight="${weight}" fill="${color}" text-anchor="${anchor}"` +
    `${mono ? ' font-family="Consolas, Cascadia Mono, monospace"' : ""}${spacing ? ` letter-spacing="${spacing}"` : ""}>${esc(line)}</text>`
  ).join("");
}

function node(n) {
  const tone = TONES[n.tone || "gray"];
  const { x, y, w, h } = n;
  const titleLines = n.title.split("\n").length;
  const subLines = n.sub ? n.sub.split("\n").length : 0;
  const block = 16 + (titleLines - 1) * 21 + (subLines ? 21 + (subLines - 1) * 18 : 0) + (n.tech ? 20 : 0) + 4;
  let baseline = y + (h - block) / 2 + 16;
  let svg = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="14" fill="${n.filled ? tone.tint : "#ffffff"}" stroke="${tone.stroke}" stroke-width="1.6"${n.dashed ? ' stroke-dasharray="7 5"' : ""} filter="url(#shadow)"/>`;
  svg += `<rect x="${x + 1}" y="${y + 14}" width="5" height="${h - 28}" rx="2.5" fill="${tone.accent}"/>`;
  const left = x + 20;
  svg += text(n.title, left, baseline, { size: 16.5, weight: 650, lh: 21 });
  baseline += (titleLines - 1) * 21 + 21;
  if (n.sub) {
    svg += text(n.sub, left, baseline, { size: 13.5, color: "#475569", lh: 18 });
    baseline += (subLines - 1) * 18 + 20;
  }
  if (n.tech) svg += text(n.tech, left, baseline, { size: 12.5, color: tone.accent, mono: true });
  if (n.badge) {
    svg += `<circle cx="${x + w - 22}" cy="${y + 22}" r="13" fill="${tone.accent}"/>`;
    svg += text(n.badge, x + w - 22, y + 27, { size: 13, weight: 700, color: "#ffffff", anchor: "middle" });
  }
  return svg;
}

function pill(label, x, y, tone) {
  const w = width(label, 12.5, 600) + 18;
  return `<rect x="${x - w / 2}" y="${y - 12}" width="${w}" height="24" rx="12" fill="#ffffff" stroke="${TONES[tone].stroke}" stroke-width="1.2"/>` +
    text(label, x, y + 4.5, { size: 12.5, weight: 600, color: TONES[tone].accent, anchor: "middle" });
}

function edge(e) {
  const tone = e.tone || "gray";
  const d = "M" + e.points.map((point) => point.join(",")).join(" L");
  let svg = "";
  if (e.halo) svg += `<path d="${d}" fill="none" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>`;
  svg += `<path d="${d}" fill="none" stroke="${TONES[tone].accent}" stroke-width="2.2" stroke-linejoin="round"` +
    `${e.dashed ? ' stroke-dasharray="7 6"' : ""}${e.noArrow ? "" : ` marker-end="url(#arrow-${tone})"`}/>`;
  if (e.label) svg += pill(e.label, e.labelAt[0], e.labelAt[1], tone);
  return svg;
}

function zone(z) {
  const tone = TONES[z.tone || "gray"];
  const right = z.labelRight;
  return `<rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="18" fill="${tone.tint}" fill-opacity="0.55" stroke="${tone.accent}" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="8 6"/>` +
    text(z.label, right ? z.x + z.w - 16 : z.x + 16, z.y + 21, { size: 12, weight: 700, color: tone.accent, spacing: 1.2, anchor: right ? "end" : "start" });
}

function chip(label, x, y, tone) {
  const w = width(label, 13.5, 600) + 26;
  return { w, svg: `<rect x="${x}" y="${y}" width="${w}" height="32" rx="16" fill="${TONES[tone].tint}" stroke="${TONES[tone].stroke}" stroke-width="1.2"/>` +
    text(label, x + w / 2, y + 21, { size: 13.5, weight: 600, color: TONES[tone].accent, anchor: "middle" }) };
}

function svgFrame(w, h, body) {
  const markers = Object.entries(TONES).map(([name, tone]) =>
    `<marker id="arrow-${name}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${tone.accent}"/></marker>`
  ).join("");
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">` +
    `<defs>${markers}<filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/></filter></defs>` +
    `<rect width="${w}" height="${h}" fill="#ffffff"/>${body}</svg>`;
}

function render(id, spec) {
  let body = (spec.zones || []).map(zone).join("");
  body += (spec.under || []).join("");
  body += (spec.edges || []).filter((e) => !e.halo).map(edge).join("");
  body += (spec.nodes || []).map(node).join("");
  body += (spec.edges || []).filter((e) => e.halo).map(edge).join("");
  body += (spec.labels || []).join("");
  body += (spec.over || []).join("");
  document.getElementById(id).innerHTML = svgFrame(spec.w, spec.h, body);
}

function banner(x, y, w, h, message, tone = "navy") {
  const fill = tone === "navy" ? "#0f172a" : TONES[tone].tint;
  const color = tone === "navy" ? "#ffffff" : TONES[tone].accent;
  const stroke = tone === "navy" ? "#0f172a" : TONES[tone].stroke;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="${fill}" stroke="${stroke}"/>` +
    text(message, x + w / 2, y + h / 2 + 6, { size: 16, weight: 650, color, anchor: "middle" });
}
